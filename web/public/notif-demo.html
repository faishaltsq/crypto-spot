<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notifikasi Demo - Crypto Spot Signal</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; background:#0b0e14; color:#e6e6e6; }
    h1 { font-size: 20px; }
    button { display:block; width:100%; margin:10px 0; padding:14px; font-size:15px; border:0; border-radius:8px; cursor:pointer; background:#1f6feb; color:#fff; }
    button.sell { background:#d1242f; }
    button.perm { background:#2d333b; }
    .log { margin-top:16px; padding:12px; background:#161b22; border-radius:8px; font-size:13px; white-space:pre-wrap; min-height:60px; }
    .muted { color:#8b949e; font-size:13px; }
  </style>
</head>
<body>
  <h1>Demo Notifikasi + Suara</h1>
  <p class="muted">Klik "Aktifkan izin" sekali, lalu tekan tombol BUY/SELL. Suara memakai file yang sama dengan app: <code>/notification.mp3</code>.</p>

  <button class="perm" id="perm">1. Aktifkan izin notifikasi</button>
  <button id="buy">Trigger notif BUY (dengan suara)</button>
  <button class="sell" id="sell">Trigger notif SELL (dengan suara)</button>
  <button class="perm" id="soundonly">Tes suara saja</button>

  <div class="log" id="log">Status: menunggu...</div>

  <script>
    const logEl = document.getElementById('log');
    const log = (m) => { logEl.textContent = 'Status: ' + m; console.log(m); };

    async function playSound() {
      const audio = new Audio('/notification.mp3');
      try { await audio.play(); log('suara diputar'); }
      catch (e) { log('suara gagal: ' + e.message + ' (klik halaman dulu)'); }
    }

    async function notify(title, body, tag) {
      if (Notification.permission !== 'granted') {
        log('izin belum granted. Klik tombol 1 dulu.');
        return;
      }
      if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        const reg = await navigator.serviceWorker.ready;
        await reg.showNotification(title, { body, tag, data: { url: '/' } });
      } else {
        new Notification(title, { body, tag });
      }
    }

    document.getElementById('perm').onclick = async () => {
      const p = await Notification.requestPermission();
      log('izin notifikasi: ' + p);
    };
    document.getElementById('buy').onclick = async () => {
      await playSound();
      await notify('BTC_USDT BUY', 'Score 87.5 | 15m | AI review CONFIRM', 'demo-buy');
    };
    document.getElementById('sell').onclick = async () => {
      await playSound();
      await notify('ETH_USDT SELL', 'Score 82.0 | 1h | AI review CONFIRM', 'demo-sell');
    };
    document.getElementById('soundonly').onclick = playSound;
  </script>
</body>
</html>
